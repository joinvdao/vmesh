name: Feature Request
description: Propose a public vmesh product or platform improvement.
title: "[feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Use this for public product work that can be discussed openly.
  - type: textarea
    id: problem
    attributes:
      label: Problem Or Opportunity
      description: What user or community need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Direction
      description: Describe the feature, workflow, or interface change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mesh rendering
        - Terrain providers
        - Parcel intelligence
        - Macro data
        - Micro data
        - User-added data
        - Analytics
        - Documentation
        - Developer workflow
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - ...
        - ...
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy Check
      options:
        - label: This can be discussed in a public open-source repository.
          required: true
