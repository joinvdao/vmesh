name: Bug Report
description: Report a reproducible problem in vmesh.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve vmesh. Please avoid private data, secrets, exact private addresses, or unpublished provider details.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: List the shortest clear path to reproduce the issue.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, viewport, branch, or commit if relevant.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy Check
      options:
        - label: I did not include secrets, private notes, exact private addresses, or personal contact details.
          required: true
